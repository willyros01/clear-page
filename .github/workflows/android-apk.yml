name: ATE Android APK
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths: ['src/**', 'index.html', 'package*.json', 'capacitor.config.json', 'build.mjs', 'build/android-*', 'build/prepare-android.mjs', 'resources/stickman-icon.png.base64', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: ate-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
      - name: Build and check Android release
        run: bash build/android-build.sh
      - name: Sign with permanent ATE key
        id: sign
        env:
          ATE_ANDROID_SIGNING: ${{ secrets.ATE_ANDROID_SIGNING }}
        run: node build/android-sign.mjs
      - name: Retain build evidence if signing setup is incomplete
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ATE-unsigned-build-evidence-not-for-installation
          path: out/ate-unsigned.apk
          if-no-files-found: ignore
      - name: Upload verified signed APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ate-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Record successful artifact for Cuberoot publisher
        env:
          ARTIFACT_ID: ${{ steps.apk.outputs.artifact-id }}
          APK_NAME: ${{ steps.sign.outputs.apk_name }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync,readFileSync} from 'node:fs';
          const e=process.env;
          writeFileSync(e.RUNNER_TEMP+'/ate-last-run.json',JSON.stringify({workflow:'ATE Android APK',branch:'android',outcome:'success',run_id:Number(e.GITHUB_RUN_ID),run_number:Number(e.GITHUB_RUN_NUMBER),source_sha:e.GITHUB_SHA,artifact_id:Number(e.ARTIFACT_ID),apk_name:e.APK_NAME,version:JSON.parse(readFileSync('package.json')).version,signer_sha256:readFileSync('resources/android-signer.sha256','utf8').trim(),reported_at:new Date().toISOString()},null,2)+'\n');
          JS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin apk-releases 2>/dev/null && git switch -C apk-releases origin/apk-releases || git switch --orphan apk-releases
          git rm -rf --ignore-unmatch . >/dev/null
          cp "$RUNNER_TEMP/ate-last-run.json" ate-last-run.json
          git add ate-last-run.json
          git commit -m "Record successful ATE APK $GITHUB_RUN_NUMBER"
          git push origin HEAD:apk-releases
