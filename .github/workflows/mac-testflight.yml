name: ATE Mac TestFlight
# Uploads the universal Mac app already built and natively verified by a successful
# "ATE Apple and Desktop" run, as a sandboxed Mac App Store build. Nothing is rebuilt,
# so the TestFlight app is byte-for-byte the tested app before App Store signing.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful ATE Apple and Desktop run id
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ate-mac-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a successful native-verified desktop run of this same application source
        shell: bash
        run: |
          set -euo pipefail
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          test "$(jq -r .path <<<"$RUN")" = ".github/workflows/all-platforms.yml"
          test "$(jq -r .head_branch <<<"$RUN")" = "desktop"
          SHA=$(jq -r .head_sha <<<"$RUN")
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100")
          test "$(jq -r '.jobs[]|select(.name=="mac-build").conclusion' <<<"$JOBS")" = "success"
          # Only workflow files may differ between the tested source and this checkout.
          git diff --quiet "$SHA" HEAD -- . ':(exclude).github'
          echo "Using universal app from run $SOURCE_RUN, source $SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use Xcode 27.0 (iOS 27 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_27.0*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo 'Xcode 27 is required for new Apple builds.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ate-mac-universal-preview
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: mac-input
      - name: Sign for the Mac App Store sandbox, upload, verify Apple processing and assign existing testers
        run: bash build/mac-release.sh testflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-mac-testflight-evidence
          path: ${{ runner.temp }}/ate-mac-testflight/*.log
