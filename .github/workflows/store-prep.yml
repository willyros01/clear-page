name: ATE App Store preparation
on:
  push:
    branches: [desktop]
    paths: ["src/**", "src-tauri/**", "tests/**", "resources/**", "store/**", "build/**", "index.html", "package*.json", ".github/workflows/store-prep.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ate-store-preparation-destination-full-allowance
  cancel-in-progress: false
env:
  ATE_BUILD_NUMBER: "28"
jobs:
  regression:
    permissions:
      contents: read
      actions: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[store-prep]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel only the obsolete queued preparation retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/willyros01/clear-page/actions/runs/43812434868',headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base,{headers});if(!r.ok)throw Error('Queued retry lookup failed');const run=await r.json();
          if(run.head_sha!=='d85783e32689c9338ec2377ec34ac3cc817d9156'||run.path!=='.github/workflows/store-prep.yml')throw Error('Unexpected queued retry');
          if(['pending','queued','waiting'].includes(run.status)){const c=await fetch(base+'/cancel',{method:'POST',headers});if(![202,409].includes(c.status))throw Error('Queued retry cancellation HTTP '+c.status);console.log('Stopped only obsolete queued retry 43812434868; successful Mac and active iPhone retained.')}else console.log('Obsolete retry is no longer queued; left untouched.');
          JS
      - name: Stop the obsolete test-fixture retry before repeating native builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/willyros01/clear-page/actions/runs/43816049754',headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base,{headers});if(!r.ok)throw Error('Old fixture retry lookup failed');const run=await r.json();if(run.head_sha!=='dc6ce81767dcca1a571d2b1630d49c67244ceacb'||run.path!=='.github/workflows/store-prep.yml')throw Error('Unexpected old retry');
          if(run.status!=='completed'){const c=await fetch(base+'/cancel',{method:'POST',headers});if(![202,409].includes(c.status))throw Error('Cancel obsolete test retry HTTP '+c.status)}
          console.log('Only obsolete fixture retry stopped. Original successful native Mac and completed iPhone core evidence retained.');
          JS
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: sudo find /etc/apt/sources.list.d -iname '*microsoft*' -print -delete || true
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tabs-browser-evidence-attempt-${{ github.run_attempt }}
          path: editor-evidence/*
  simulator:
    needs: regression
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Boot native 13-inch iPad
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad" in x["name"] and "13-inch" in x["name"]))')
          echo "$DEVICE" > "$RUNNER_TEMP/ipad-device.txt"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Require previously captured native iPad photo provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/willyros01/clear-page',headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base+'/actions/runs/43825172029',{headers});if(!r.ok)throw Error('Photo source lookup failed');const source=await r.json();if(source.head_sha!=='31265c2f910f67bd841a2b96709266399e5fd0dc'||source.path!=='.github/workflows/store-prep.yml')throw Error('Wrong photo source');
          const q=await fetch(base+'/actions/runs/43825172029/jobs?per_page=100',{headers});if(!q.ok)throw Error('Photo step lookup failed');const job=(await q.json()).jobs.find(x=>x.name==='simulator (iPad)');if(!job?.steps.some(x=>x.name==='Capture genuine native iPad UI with generated sample files'&&x.conclusion==='success'))throw Error('Native photo capture did not complete');console.log('PASS: preserve four successful genuine iPad captures; only native test automation changed.');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-iPad-screenshots
          run-id: 43825172029
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/store-ipad-native
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-iPad-screenshots
          path: ${{ runner.temp }}/store-ipad-native/*
          if-no-files-found: error
      - name: Restore clean production assets for native functional tests
        run: |
          npm run build
          node scripts/prepare-ios.mjs
          node -e 'const s=require("fs").readFileSync("dist/app.js","utf8");for(const x of ["ATE_IPAD_SYNTAX_VERIFICATION_ONLY","ATE_STORE_SCREENSHOT_ONLY"])if(s.includes(x))throw Error("Verification code in production assets")'
          if ! ruby -e "require 'xcodeproj'";then gem install --user-install xcodeproj --no-document;fi
          ruby tests/ios/add-ui-tests.rb
      - name: Build native test targets once
        id: native-build
        run: |
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcodebuild build-for-testing -project ios/App/App.xcodeproj -scheme ATEFunctional -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ipad-ui-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ipad-ui-build.log";exit 1; }
      - name: Verify remaining native project destination and Close case
        run: |
          set -o pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          FAILURES=0
          for CASE in testProjectDestinationsAndClose;do
            xcrun simctl terminate "$DEVICE" io.github.willyros01.clearpage || true
            xcrun simctl uninstall "$DEVICE" io.github.willyros01.clearpage || true
            xcodebuild test-without-building -project ios/App/App.xcodeproj -scheme ATEFunctional -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/DerivedData" -only-testing:"ATEFunctionalTests/ATEFunctionalTests/$CASE" -resultBundlePath "$RUNNER_TEMP/ATERepair-$CASE.xcresult" CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 2>&1 | tee "$RUNNER_TEMP/repair-$CASE.log" | awk '/Test Case|PASS native|error:|failed|TEST SUCCEEDED/{print;fflush()}' || { xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/failed-$CASE.png";tail -150 "$RUNNER_TEMP/repair-$CASE.log";FAILURES=1; }
          done
          exit "$FAILURES"
      - name: Require complete genuine native screenshot set before Apple upload
        run: |
          python3 - <<'PY_CHECK'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'store-ipad-native'
          assert json.loads((root/'provenance.json').read_text())['passed'] is True
          for label in ['01-editor','02-projects','03-syntax','04-menu']:assert (root/('store-'+label+'.png')).stat().st_size>1000
          print('PASS: all four genuine iPad screenshots captured; no screenshot preparation failure ignored.')
          PY_CHECK
      - name: Export diagnostic screenshots even when a native test fails
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ipad-repair-attachments"
          for RESULT in "$RUNNER_TEMP"/ATERepair-*.xcresult "$RUNNER_TEMP"/ATELarge-*.xcresult;do
            if [ -d "$RESULT" ];then xcrun xcresulttool export attachments --path "$RESULT" --output-path "$RUNNER_TEMP/ipad-repair-attachments/$(basename "$RESULT")" || true;fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-ipad-repaired-native-evidence
          path: |
            ${{ runner.temp }}/ipad-build.log
            ${{ runner.temp }}/ipad-ui-build.log
            ${{ runner.temp }}/repair-*.log
            ${{ runner.temp }}/large-*.log
            ${{ runner.temp }}/failed-*.png
            ${{ runner.temp }}/ipad-repair-attachments/**
  testflight:
    needs: [regression, simulator, mac-verify, iphone-verified, iphone-largest, ipad-verified]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require the latest tested iOS revision
        run: |
          CURRENT=$(git ls-remote origin refs/heads/desktop | cut -f1)
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then echo 'Newer iOS work exists; refusing a stale upload.'; exit 1; fi
      - run: bash build/ios-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tabs-release-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clear-page-release/*.log

  mac-verify:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preserved native Mac artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node store/reuse-mac.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-mac-input
          run-id: 43810798310
          github-token: ${{ github.token }}
          path: mac-input
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-mac-input
          path: mac-input/*
          if-no-files-found: error
  account-survey:
    needs: regression
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node store/account-survey.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-account-survey
          path: store/account-evidence/survey.json
  mac-testflight:
    needs: [regression, simulator, mac-verify, iphone-verified, iphone-largest, ipad-verified]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-mac-input
          path: mac-input
      - name: Require current tested special-build source
        run: test "$(git ls-remote origin refs/heads/desktop | cut -f1)" = "$GITHUB_SHA"
      - run: bash build/mac-release.sh testflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-store-mac-release-evidence
          path: ${{ runner.temp }}/ate-mac-testflight/*.log

  iphone-verified:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ios-tabs-iPhone-evidence-attempt-1
          run-id: 43810798310
          github-token: ${{ github.token }}
          path: iphone-evidence
      - name: Require the preserved native iPhone core and screenshot gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node store/reuse-iphone.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-iPhone-screenshots
          run-id: 43810798310
          github-token: ${{ github.token }}
          path: store-native-iphone
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-iPhone-screenshots
          path: store-native-iphone/**
          if-no-files-found: error

  iphone-largest:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require completed repaired native iPhone largest-text gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch('https://api.github.com/repos/willyros01/clear-page/actions/runs/43816569242/jobs?per_page=100',{headers});if(!r.ok)throw Error('iPhone largest gate lookup failed');const j=(await r.json()).jobs.find(x=>x.name==='iphone-largest');if(!j||j.conclusion!=='success')throw Error('Repaired native iPhone consent and largest-text Save are not passed');console.log('PASS: exact application source retained; fresh largest-text native iPhone cases passed in run 43816569242.');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: ate-iphone-repaired-largest-text-evidence
          run-id: 43816569242
          github-token: ${{ github.token }}
          path: iphone-largest-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: ate-iphone-repaired-largest-text-evidence
          path: iphone-largest-evidence/**

  ipad-verified:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ios-tabs-iPad-evidence-attempt-1
          run-id: 43816569242
          github-token: ${{ github.token }}
          path: ipad-evidence
      - uses: actions/download-artifact@v4
        with:
          name: ate-ipad-repaired-native-evidence
          run-id: 43866159579
          github-token: ${{ github.token }}
          path: ipad-repaired-evidence
      - name: Verify retained iPad native engines and completed functional cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node store/reuse-ipad.mjs
