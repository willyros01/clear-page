name: ATE App Store preparation
on:
  push:
    branches: [desktop]
    paths: ["src/**", "src-tauri/**", "tests/**", "resources/**", "store/**", "build/**", "index.html", "package*.json", ".github/workflows/store-prep.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ate-store-preparation-consent-v2
  cancel-in-progress: false
env:
  ATE_BUILD_NUMBER: "28"
jobs:
  regression:
    permissions:
      contents: read
      actions: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[store-prep]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel only the obsolete queued preparation retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/willyros01/clear-page/actions/runs/43812434868',headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base,{headers});if(!r.ok)throw Error('Queued retry lookup failed');const run=await r.json();
          if(run.head_sha!=='d85783e32689c9338ec2377ec34ac3cc817d9156'||run.path!=='.github/workflows/store-prep.yml')throw Error('Unexpected queued retry');
          if(['pending','queued','waiting'].includes(run.status)){const c=await fetch(base+'/cancel',{method:'POST',headers});if(![202,409].includes(c.status))throw Error('Queued retry cancellation HTTP '+c.status);console.log('Stopped only obsolete queued retry 43812434868; successful Mac and active iPhone retained.')}else console.log('Obsolete retry is no longer queued; left untouched.');
          JS
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tabs-browser-evidence-attempt-${{ github.run_attempt }}
          path: editor-evidence/*
  simulator:
    needs: regression
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Boot simulator
        env:
          DEVICE_KIND: ${{ matrix.device }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os;d=json.load(sys.stdin);c=[x for a in d["devices"].values() for x in a if os.environ["DEVICE_KIND"] in x["name"]];print(next((x["udid"] for x in c if ("iPhone 17 Pro" == x["name"] if os.environ["DEVICE_KIND"]=="iPhone" else "13-inch" in x["name"])),c[0]["udid"]))')
          echo "$DEVICE" > "$RUNNER_TEMP/ipad-device.txt"
          xcrun simctl boot "$DEVICE"
      - run: npm ci
      - run: ATE_IOS_VERIFICATION=1 npm run build
      - run: node scripts/prepare-ios.mjs
      - name: Build simulator regression app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ipad-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ipad-build.log"; exit 1; }
      - name: Run native parser, editor, tabs and process-recovery checks
        run: |
          set -euo pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE" io.github.willyros01.clearpage
          DATA=$(xcrun simctl get_app_container "$DEVICE" io.github.willyros01.clearpage data)
          REPORT="$DATA/Documents/ate-ipad-syntax-verification.json"
          READY="$DATA/Documents/ate-ipad-restart-ready.json"
          for attempt in {1..360}; do
            if [ -f "$REPORT" ]; then break; fi
            if [ -f "$READY" ]; then
              rm "$READY"
              xcrun simctl terminate "$DEVICE" io.github.willyros01.clearpage
              xcrun simctl launch "$DEVICE" io.github.willyros01.clearpage
            fi
            sleep 1
          done
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/ipad-syntax.png"
          if [ ! -f "$REPORT" ]; then echo 'Native verification report missing'; exit 1; fi
          cp "$REPORT" "$RUNNER_TEMP/ipad-syntax.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1])); console.log(r.checks.map(x=>"PASS: "+x).join("\n")); if(!r.passed)throw Error(r.error);' "$RUNNER_TEMP/ipad-syntax.json"
      - name: Build clean production assets for native UI tests
        run: |
          npm run build
          node scripts/prepare-ios.mjs
          node -e 'const s=require("fs").readFileSync("dist/app.js","utf8");for(const marker of ["ATE_IPAD_SYNTAX_VERIFICATION_ONLY","ate-tabs-verification-restart"])if(s.includes(marker))throw Error("Verification driver in production assets");'
      - name: Prepare XCUITest target
        run: |
          if ! ruby -e "require 'xcodeproj'"; then gem install --user-install xcodeproj --no-document; fi
          ruby tests/ios/add-ui-tests.rb
      - name: Focused project layout and nested-dialog accessibility regression
        run: |
          set -o pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcrun simctl terminate "$DEVICE" io.github.willyros01.clearpage || true
          xcrun simctl uninstall "$DEVICE" io.github.willyros01.clearpage
          xcodebuild test -project ios/App/App.xcodeproj -scheme ATEFunctional -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/DerivedData" -only-testing:ATEFunctionalTests/ATEFunctionalTests/testProjectLayoutAccessibility -resultBundlePath "$RUNNER_TEMP/ATEProjectFocus.xcresult" CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 2>&1 | tee "$RUNNER_TEMP/project-focus-tests.log" | awk '/Test Case|PASS native|error:|failed|TEST SUCCEEDED/ { print; fflush() }' || { tail -180 "$RUNNER_TEMP/project-focus-tests.log"; exit 1; }
      - name: Native functional tests including Files and Share cancellation
        run: |
          set -o pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcrun simctl terminate "$DEVICE" io.github.willyros01.clearpage || true
          xcrun simctl uninstall "$DEVICE" io.github.willyros01.clearpage
          xcodebuild test -project ios/App/App.xcodeproj -scheme ATEFunctional -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/DerivedData" -skip-testing:ATEFunctionalTests/ATEFunctionalTests/testProjectLayoutAccessibility -resultBundlePath "$RUNNER_TEMP/ATEFunctional.xcresult" CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 2>&1 | tee "$RUNNER_TEMP/ui-tests.log" | awk '/Test Case|PASS native|error:|failed|App animations|TEST SUCCEEDED/ { print; fflush() }' || { python3 -c 'import sys,re;print("\n".join([x.rstrip() for x in open(sys.argv[1]) if re.search("error:|XCTAssert|failed|Test Case|PASS native",x)][-35:]))' "$RUNNER_TEMP/ui-tests.log"; echo "=== Screen state at each failure ==="; grep -B 40 -A 150 'error: -\[' "$RUNNER_TEMP/ui-tests.log" | head -1200 || true; tail -70 "$RUNNER_TEMP/ui-tests.log"; exit 1; }
      - name: Export native App Store screenshot attachments
        run: |
          mkdir -p "$RUNNER_TEMP/store-native"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ATEFunctional.xcresult" --output-path "$RUNNER_TEMP/store-native"
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-${{ matrix.device }}-screenshots
          path: ${{ runner.temp }}/store-native/**
          if-no-files-found: error
      - name: Largest accessibility text toolbar, Save and project layout verification
        run: |
          set -o pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcrun simctl ui "$DEVICE" content_size accessibility-extra-extra-extra-large
          xcodebuild test -project ios/App/App.xcodeproj -scheme ATEFunctional -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/DerivedData" -only-testing:ATEFunctionalTests/ATEFunctionalTests/testToolbarAndSaveVisibility -only-testing:ATEFunctionalTests/ATEFunctionalTests/testProjectLayoutAccessibility -resultBundlePath "$RUNNER_TEMP/ATELargeText.xcresult" CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 2>&1 | tee "$RUNNER_TEMP/large-text-tests.log" | awk '/Test Case|PASS native|error:|failed|App animations|TEST SUCCEEDED/ { print; fflush() }' || { tail -80 "$RUNNER_TEMP/large-text-tests.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tabs-${{ matrix.device }}-evidence-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ipad-build.log
            ${{ runner.temp }}/ipad-syntax.json
            ${{ runner.temp }}/ipad-syntax.png
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/project-focus-tests.log
            ${{ runner.temp }}/ATEProjectFocus.xcresult
            ${{ runner.temp }}/ATEFunctional.xcresult
            ${{ runner.temp }}/ATELargeText.xcresult
            ${{ runner.temp }}/large-text-tests.log
  testflight:
    needs: [regression, simulator, mac-verify, iphone-verified]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require the latest tested iOS revision
        run: |
          CURRENT=$(git ls-remote origin refs/heads/desktop | cut -f1)
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then echo 'Newer iOS work exists; refusing a stale upload.'; exit 1; fi
      - run: bash build/ios-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-tabs-release-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clear-page-release/*.log

  mac-verify:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preserved native Mac artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node store/reuse-mac.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-mac-input
          run-id: 43810798310
          github-token: ${{ github.token }}
          path: mac-input
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-mac-input
          path: mac-input/*
          if-no-files-found: error
  account-survey:
    needs: regression
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node store/account-survey.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-account-survey
          path: store/account-evidence/survey.json
  mac-testflight:
    needs: [regression, simulator, mac-verify, iphone-verified]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-mac-input
          path: mac-input
      - name: Require current tested special-build source
        run: test "$(git ls-remote origin refs/heads/desktop | cut -f1)" = "$GITHUB_SHA"
      - run: bash build/mac-release.sh testflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-store-mac-release-evidence
          path: ${{ runner.temp }}/ate-mac-testflight/*.log

  iphone-verified:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the preserved full native iPhone gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node store/reuse-iphone.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ate-store-iPhone-screenshots
          run-id: 43810798310
          github-token: ${{ github.token }}
          path: store-native-iphone
      - uses: actions/upload-artifact@v4
        with:
          name: ate-store-iPhone-screenshots
          path: store-native-iphone/**
          if-no-files-found: error
