name: ATE Apple and Desktop
run-name: ATE 0.8.7 Mac website signing from verified universal app
on:
  workflow_dispatch: {}
  push:
    branches: [desktop]
    paths: ['.github/workflows/mac-website-retry.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: ate-mac-website-retry
  cancel-in-progress: false
env:
  ATE_BUILD_NUMBER: '28'
jobs:
  mac-release:
    name: mac-release (website)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Require original successful native Mac tests and unchanged application source
        run: node store/reuse-mac.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43810798310
          name: ate-store-mac-input
          path: mac-input
      - name: Sign, notarize and staple the verified app
        run: bash build/mac-release.sh website
        env:
          MAC_DEVELOPER_ID_SIGNING: ${{ secrets.MAC_DEVELOPER_ID_SIGNING }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-mac-website-release
          path: |
            public-desktop/*
            ${{ runner.temp }}/ate-mac-website/*.log
            ${{ runner.temp }}/ate-mac-website/notary.json
  report:
    needs: mac-release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve the already verified Windows and web publication
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let n=0;n<20;n++){
            const stamp='?check='+Date.now(),options={cache:'no-store',signal:AbortSignal.timeout(30000)};
            const [a,b]=await Promise.all([fetch('https://www.cuberoot-systems.com/downloads/ate-desktop-build.json'+stamp,options),fetch('https://www.cuberoot-systems.com/ate/app/ate-web-build.json'+stamp,options)]);
            if(a.ok&&b.ok){const desktop=await a.json(),web=await b.json();if(desktop.windows?.run_id>=43874608420&&desktop.windows?.version==='0.8.7'&&web.run_id>=43874608420&&web.version==='0.8.7'){ready=true;break}}
            await new Promise(r=>setTimeout(r,30000));
          }
          if(!ready)throw Error('Windows/web publication remains pending; retain their existing release pointer.');
          JS
      - name: Record this verified Mac artifact only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';const base='https://api.github.com/repos/willyros01/clear-page/actions/runs/'+process.env.GITHUB_RUN_ID,headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'};
          const r=await fetch(base+'/artifacts?per_page=100',{headers});if(!r.ok)throw Error('Artifact lookup failed');const artifact=(await r.json()).artifacts.find(x=>x.name==='ate-mac-website-release'&&!x.expired);if(!artifact)throw Error('Signed Mac artifact missing');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/ate-mac-report.json',JSON.stringify({app:'ATE',workflow:'ATE Apple and Desktop',branch:'desktop',version:'0.8.7',build:28,run_id:Number(process.env.GITHUB_RUN_ID),source_sha:process.env.GITHUB_SHA,web_artifact_id:null,windows_artifact_id:null,mac_artifact_id:artifact.id,native_verification_run_id:43810798310,application_source_sha:'23f352a4ceb3ad99a5f112a564253f0f0dd9ea9e',created_at:new Date().toISOString()},null,2)+'\n');
          JS
      - name: Publish verified signing result
        run: |
          cp "$RUNNER_TEMP/ate-mac-report.json" "$RUNNER_TEMP/report.json"
          git fetch origin desktop-releases
          git checkout -B desktop-releases origin/desktop-releases
          cp "$RUNNER_TEMP/report.json" ate-desktop-last-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ate-desktop-last-run.json
          git commit -m "Record verified Mac signing run $GITHUB_RUN_ID"
          git push origin HEAD:desktop-releases
