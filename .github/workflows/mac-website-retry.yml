name: ATE Apple and Desktop
run-name: ATE Mac website signing from verified desktop artifact
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful desktop build run with unchanged app sources
        default: '43088542493'
        required: true
  push:
    branches: [desktop]
    paths: ['.github/workflows/mac-website-retry.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: ate-mac-website-retry
  cancel-in-progress: false
jobs:
  mac-release:
    name: mac-release (website)
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SOURCE_RUN: ${{ inputs.source_run || '43088542493' }}
      GITHUB_TOKEN: ${{ github.token }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful native tests and identical application sources
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/willyros01/clear-page/';
          const headers={Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw Error('Provenance lookup HTTP '+r.status);return r.json()}
          if(!/^\d+$/.test(process.env.SOURCE_RUN))throw Error('Invalid source run');
          const run=await get('actions/runs/'+process.env.SOURCE_RUN);
          if(run.head_branch!=='desktop')throw Error('Source is not the desktop branch');
          const {jobs}=await get('actions/runs/'+process.env.SOURCE_RUN+'/jobs?per_page=100');
          if(!jobs.some(j=>j.conclusion==='success'&&j.name.includes('desktop (macos')&&j.steps.some(s=>s.name==='Verify editing inside native Mac webview'&&s.conclusion==='success')))throw Error('Successful native Mac checks required');
          const diff=await get('compare/'+run.head_sha+'...'+process.env.GITHUB_SHA);
          if(diff.total_commits>50||diff.files.length>=300)throw Error('Comparison too large');
          for(const file of diff.files)if(!/^(build\/mac-release\.sh|[^/]+\.md|\.github\/workflows\/.*|tests\/.*)$/.test(file.filename))throw Error('Application changed since verified source: '+file.filename);
          console.log('PASS: reuse exact verified universal app from '+run.head_sha+'; only signing, workflow, tests and documentation changes are allowed.');
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: ate-mac-universal-preview
          path: mac-input
      - name: Sign, notarize and staple the verified app
        run: bash build/mac-release.sh website
        env:
          MAC_DEVELOPER_ID_SIGNING: ${{ secrets.MAC_DEVELOPER_ID_SIGNING }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-mac-website-release
          path: |
            public-desktop/*
            ${{ runner.temp }}/ate-mac-website/*.log
            ${{ runner.temp }}/ate-mac-website/notary.json
  report:
    if: always()
    needs: mac-release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run || '43088542493' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve publication of the verified Windows source build
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let attempt=0;attempt<10;attempt++){
            const r=await fetch('https://www.cuberoot-systems.com/downloads/ate-desktop-build.json?check='+Date.now(),{cache:'no-store'});
            if(r.ok&&(await r.json()).windows?.run_id>=Number(process.env.SOURCE_RUN)){ready=true;break}
            await new Promise(resolve=>setTimeout(resolve,30000));
          }
          if(!ready)throw Error('Source Windows publication still pending; preserve its report');
          JS
      - run: node build/desktop-report.mjs
      - name: Publish verified signing result
        run: |
          set -euo pipefail
          cp desktop-report/ate-desktop-last-run.json "$RUNNER_TEMP/report.json"
          git fetch origin desktop-releases
          git checkout -B desktop-releases origin/desktop-releases
          cp "$RUNNER_TEMP/report.json" ate-desktop-last-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ate-desktop-last-run.json
          git commit -m "Record verified Mac signing run $GITHUB_RUN_ID"
          git push origin HEAD:desktop-releases
