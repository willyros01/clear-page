name: ATE Apple and Desktop
on:
  push:
    branches:
      - desktop
    paths:
      - .github/workflows/android-052.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ate-android-052
  cancel-in-progress: false
env:
  ATE_BUILD_NUMBER: "17"
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-evidence
          path: editor-evidence/*
  android:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
      - run: npm ci
      - name: Build native Android verification app
        run: |-
          ATE_ANDROID_VERIFICATION=1 npm run build
          ATE_ANDROID_VERIFICATION=1 node build/prepare-android.mjs
          cd android && chmod +x gradlew && ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |-
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 11 file manager, cancellation, save and reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |-
            trap 'adb logcat -d > android-logcat.txt; adb shell screencap -p /sdcard/ate-debug.png; adb pull /sdcard/ate-debug.png android-debug.png; adb shell uiautomator dump /sdcard/ate-ui.xml; adb pull /sdcard/ate-ui.xml android-ui.xml; adb shell run-as io.github.willyros01.clearpage cat files/ate-ipad-syntax-verification.json > android-webview-report.json' EXIT
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class io.github.willyros01.clearpage.DocumentSaveTest io.github.willyros01.clearpage.test/androidx.test.runner.AndroidJUnitRunner | tee android-instrumentation.txt
            grep -q "OK (1 test)" android-instrumentation.txt
            adb pull /sdcard/Download/ate-storage-check.c android-saved.c
            node -e 'const s=require("fs").readFileSync("android-saved.c","utf8");if(s!=="int main(void) { return 0 }")throw Error("Saved text differs");'
            adb shell screencap -p /sdcard/ate-native.png
            adb pull /sdcard/ate-native.png android-native.png
      - name: Rebuild production assets without the verification driver
        run: |-
          npm run build
          node build/prepare-android.mjs
          node -e 'if(require("fs").readFileSync("dist/app.js","utf8").includes("ATE_IPAD_SYNTAX_VERIFICATION_ONLY"))throw Error("Test driver in release");'
          cd android && ./gradlew --no-daemon --console=plain assembleRelease
          cd .. && mkdir -p out && cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/ate-unsigned.apk
      - name: Sign with permanent ATE certificate
        id: sign
        env:
          ATE_ANDROID_SIGNING: ${{ secrets.ATE_ANDROID_SIGNING }}
        run: node build/android-sign.mjs
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: ate-android-apk
          path: out/*.apk
          if-no-files-found: error
      - name: Record verified APK for Cuberoot
        env:
          ARTIFACT_ID: ${{ steps.apk.outputs.artifact-id }}
          APK_NAME: ${{ steps.sign.outputs.apk_name }}
        run: |-
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const e=process.env;writeFileSync(e.RUNNER_TEMP+'/ate-last-run.json',JSON.stringify({workflow:'ATE Apple and Desktop',branch:'desktop',outcome:'success',run_id:Number(e.GITHUB_RUN_ID),run_number:Number(e.ATE_BUILD_NUMBER),source_sha:e.GITHUB_SHA,artifact_id:Number(e.ARTIFACT_ID),apk_name:e.APK_NAME,version:JSON.parse(readFileSync('package.json')).version,signer_sha256:readFileSync('resources/android-signer.sha256','utf8').trim(),reported_at:new Date().toISOString()},null,2)+'\n');
          NODE
          git fetch origin apk-releases
          git checkout -B apk-releases origin/apk-releases
          cp "$RUNNER_TEMP/ate-last-run.json" ate-last-run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ate-last-run.json
          git commit -m "Record verified ATE Android release $GITHUB_RUN_ID"
          git push origin HEAD:apk-releases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-android-native-evidence
          path: |-
            android-logcat.txt
            android-debug.png
            android-ui.xml
            android-webview-report.json
            android-instrumentation.txt
            android-native.png
            android-saved.c
            android/app/build/outputs/androidTest-results/**

# Reverify Android 11 WebView compatibility after worker API fallbacks.
