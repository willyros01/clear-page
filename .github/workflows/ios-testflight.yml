name: Clear Page TestFlight
on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths: ['.github/workflows/ios-testflight.yml']
permissions:
  contents: read
concurrency:
  group: clear-page-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Swift toolchain
        run: swift --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Archive, sign, upload and verify Apple processing
        run: bash build/ios-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clear-Page-release-evidence
          path: |
            ${{ runner.temp }}/clear-page-release/*.log
            ${{ runner.temp }}/clear-page-release/icon.png
            ${{ runner.temp }}/clear-page-release/export/*.ipa
          if-no-files-found: ignore
