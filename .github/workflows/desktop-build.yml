name: ATE Apple and Desktop
# Developer ID website signing activated with the approved repository secret.
on:
  workflow_dispatch:
  push:
    branches: [desktop, ipad-syntax]
    paths: ['src/**', 'src-tauri/**', 'index.html', 'package*.json', 'build/**', 'scripts/**', 'tests/**', '.github/workflows/desktop-build.yml']
permissions:
  contents: write
concurrency:
  group: ate-desktop-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify editing under the desktop security policy
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-browser-evidence
          path: editor-evidence/*
  desktop:
    if: ${{ !contains(github.event.head_commit.message, '[signing-setup]') && github.ref_name != 'ipad-syntax' && !contains(github.event.head_commit.message, '[ipad-first]') }}
    needs: editor
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: universal-apple-darwin
            bundle: app,dmg
            artifact: ate-mac-universal-preview
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: ate-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run desktop:icons
      - name: Build native editor verification binary
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --features editor-verification
      - name: Verify editing inside native Mac webview
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export ATE_VERIFICATION_REPORT="$RUNNER_TEMP/native-editor.txt"
          src-tauri/target/universal-apple-darwin/release/ate-desktop &
          ATE_PID=$!
          for attempt in {1..60}; do
            if [ -f "$ATE_VERIFICATION_REPORT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$ATE_VERIFICATION_REPORT" ]; then kill "$ATE_PID" || true; exit 1; fi
          cat "$ATE_VERIFICATION_REPORT"
          wait "$ATE_PID"
      - name: Verify editing inside native Windows webview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ATE_VERIFICATION_REPORT = Join-Path $env:RUNNER_TEMP 'native-editor.txt'
          $app = Start-Process 'src-tauri/target/x86_64-pc-windows-msvc/release/ate-desktop.exe' -PassThru
          if (!$app.WaitForExit(60000)) { Stop-Process -Id $app.Id; throw 'Native editor checks timed out' }
          Get-Content $env:ATE_VERIFICATION_REPORT
          if ($app.ExitCode -ne 0) { throw 'Native editor behavior failed' }
      - name: Save native editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-editor-${{ runner.os }}
          path: ${{ runner.temp }}/native-editor.txt
      - name: Build desktop installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify universal Mac binary and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/ATE.app
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          lipo "$APP/Contents/MacOS/$EXECUTABLE" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/$EXECUTABLE" > "$RUNNER_TEMP/ate-mac-launch.log" 2>&1 &
          ATE_PID=$!
          sleep 8
          kill -0 "$ATE_PID"
          kill "$ATE_PID"
          ditto -c -k --keepParent "$APP" ate-mac-app.zip
          echo 'PASS: universal arm64/x86_64 binary, ad-hoc signature and Mac launch. Not signed/notarized for public distribution. Device acceptance pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Windows installer and launch installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'ATE-installed'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Install failed: $($setup.ExitCode)" }
          $exe = Join-Path $destination 'ATE.exe'
          if (!(Test-Path $exe)) { $exe = Join-Path $destination 'ate-desktop.exe' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw 'Installed editor exited unexpectedly' }
          Stop-Process -Id $app.Id
          'PASS: Windows installer and installed application launch. Unsigned installer; physical-device acceptance pending.' >> $env:GITHUB_STEP_SUMMARY
      - run: node build/stage-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop-artifacts/*
          if-no-files-found: error
  apple-readiness:
    if: ${{ github.ref_name != 'ipad-syntax' && !contains(github.event.head_commit.message, '[ipad-first]') }}
    needs: editor
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
      MAC_APP_STORE_P12: ${{ secrets.MAC_APP_STORE_P12 }}
      MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/mac-signing-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ate-mac-signing-readiness
          path: mac-signing-readiness.json
  mac-release:
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        channel: [testflight, website]
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: ate-mac-universal-preview
          path: mac-input
      - run: bash build/mac-release.sh ${{ matrix.channel }}
        env:
          MAC_DEVELOPER_ID_SIGNING: ${{ matrix.channel == 'website' && secrets.MAC_DEVELOPER_ID_SIGNING || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-mac-${{ matrix.channel }}-release
          path: |
            public-desktop/*
            ${{ runner.temp }}/ate-mac-${{ matrix.channel }}/*.log
            ${{ runner.temp }}/ate-mac-${{ matrix.channel }}/notary.json
  ipad-native:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-only]') }}
    needs: editor
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start the iPad simulator while building
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad" in x["name"]))')
          echo "$DEVICE" > "$RUNNER_TEMP/ipad-device.txt"
          xcrun simctl boot "$DEVICE"
      - run: npm ci
      - name: Build simulator-only verification assets
        run: ATE_IOS_VERIFICATION=1 npm run build
      - run: node scripts/prepare-ios.mjs
      - name: Build iPad simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ipad-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ipad-build.log"; exit 1; }
      - name: Verify syntax checking in the real iPad webview
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(cat "$RUNNER_TEMP/ipad-device.txt")
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE" io.github.willyros01.clearpage
          DATA=$(xcrun simctl get_app_container "$DEVICE" io.github.willyros01.clearpage data)
          REPORT="$DATA/Documents/ate-ipad-syntax-verification.json"
          for attempt in {1..120}; do
            if [ -f "$REPORT" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/ipad-syntax.png"
          if [ ! -f "$REPORT" ]; then echo 'Native verification report missing'; exit 1; fi
          cp "$REPORT" "$RUNNER_TEMP/ipad-syntax.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1])); console.log(r.checks.map(x=>"PASS: "+x).join("\n")); if(!r.passed)throw Error(r.error);' "$RUNNER_TEMP/ipad-syntax.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-ipad-native-evidence
          path: |
            ${{ runner.temp }}/ipad-build.log
            ${{ runner.temp }}/ipad-syntax.json
            ${{ runner.temp }}/ipad-syntax.png
  ipad-testflight:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-only]') }}
    needs: [editor, ipad-native]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash build/ios-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ate-ipad-release-evidence
          path: ${{ runner.temp }}/clear-page-release/*.log
  report:
    if: ${{ always() && !contains(github.event.head_commit.message, '[signing-setup]') && github.ref_name != 'ipad-syntax' && !contains(github.event.head_commit.message, '[ipad-first]') }}
    needs: [desktop, mac-release, ipad-testflight]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/desktop-report.mjs
      - name: Publish release result for Cuberoot
        shell: bash
        run: |
          set -euo pipefail
          cp desktop-report/ate-desktop-last-run.json "$RUNNER_TEMP/ate-desktop-last-run.json"
          git fetch origin desktop-releases || true
          if git show-ref --verify --quiet refs/remotes/origin/desktop-releases; then
            git checkout -B desktop-releases origin/desktop-releases
          else
            git checkout --orphan desktop-releases
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/ate-desktop-last-run.json" ate-desktop-last-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ate-desktop-last-run.json
          git commit -m "Record ATE desktop run $GITHUB_RUN_ID"
          git push origin HEAD:desktop-releases
