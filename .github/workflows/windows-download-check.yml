name: ATE public Windows download verification
on:
  workflow_dispatch:
  push:
    branches: [desktop]
    paths: ['.github/workflows/windows-download-check.yml']
permissions:
  contents: read
jobs:
  download-install-launch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Follow the website download button in Microsoft Edge
        shell: pwsh
        run: |
          $task = Join-Path $env:RUNNER_TEMP 'ate-download-browser'
          New-Item -ItemType Directory -Force $task | Out-Null
          npm install --prefix $task --no-save playwright@1.62.1
          $script = @'
          import {chromium} from 'playwright';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const browser=await chromium.launch({channel:'msedge'});
          try{
            const page=await browser.newPage({acceptDownloads:true});
            await page.goto('https://www.cuberoot-systems.com/ate/');
            const button=page.locator('#windows-download');
            await button.waitFor({state:'visible'});
            const [download]=await Promise.all([page.waitForEvent('download'),button.click()]);
            if(download.suggestedFilename()!=='ate-windows.exe')throw Error('Wrong downloaded filename: '+download.suggestedFilename());
            const destination=join(process.env.RUNNER_TEMP,'ATE-setup.exe');
            await download.saveAs(destination);
            const meta=await (await fetch('https://www.cuberoot-systems.com/downloads/ate-desktop-build.json',{cache:'no-store'})).json();
            const bytes=readFileSync(destination),hash=createHash('sha256').update(bytes).digest('hex');
            if(hash!==meta.windows.sha256||bytes.length!==meta.windows.bytes)throw Error('Browser download checksum mismatch');
            const result='PASS: Microsoft Edge followed the actual website button, saved ate-windows.exe and verified the complete installer checksum. Interactive SmartScreen/device acceptance remains unverified.';
            console.log(result);writeFileSync(join(process.env.RUNNER_TEMP,'browser-download.txt'),result);
          }finally{await browser.close()}
          '@
          $scriptPath = Join-Path $task 'download.mjs'
          [IO.File]::WriteAllText($scriptPath, $script)
          node $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Website browser download failed' }
      - name: Verify the browser-downloaded installer and its security confirmation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://www.cuberoot-systems.com/downloads/'
          $meta = Invoke-RestMethod ($base + 'ate-desktop-build.json')
          $installer = Join-Path $env:RUNNER_TEMP 'ATE-setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $meta.windows.sha256) { throw 'Public installer checksum mismatch' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -ne $meta.windows.bytes -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows executable' }
          $destination = Join-Path $env:RUNNER_TEMP 'ATE-public-installed'
          Get-AuthenticodeSignature $installer | Select-Object Status,StatusMessage | Format-List
          Get-Content $installer -Stream Zone.Identifier -ErrorAction SilentlyContinue
          $installJob = Start-Job -ArgumentList $installer,$destination -ScriptBlock {
            param($installer,$destination)
            $setup = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
            $setup.ExitCode
          }
          # Accept only the expected warning for this checksum-verified fixture.
          # Keep Mark-of-the-Web and Windows security settings unchanged.
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = [Windows.Automation.AutomationElement]::RootElement
          $condition = New-Object Windows.Automation.PropertyCondition ([Windows.Automation.AutomationElement]::NameProperty), 'Open File - Security Warning'
          for ($attempt=0; $attempt -lt 20 -and $installJob.State -eq 'Running'; $attempt++) {
            $warning = $root.FindFirst([Windows.Automation.TreeScope]::Children,$condition)
            if ($warning) {
              $texts = $warning.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name }
              if (($texts -join ' ') -notmatch [regex]::Escape($installer)) { throw 'Unexpected security dialog destination' }
              if (($texts -join ' ') -notmatch 'Unknown Publisher') { throw 'Unexpected publisher warning' }
              'PASS: Edge downloaded a checksum-verified Windows application. Windows displayed the expected Unknown Publisher confirmation for this unsigned installer. This is a warning check; installation acceptance is not claimed.' | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-security-warning.txt')
              # Dismiss this test worker's confirmation without approving execution.
              $owner = $warning.Current.ProcessId
              if ($owner -eq $PID -or (Get-Process -Id $owner).ProcessName -ne 'pwsh') { throw 'Unexpected dialog owner' }
              Stop-Process -Id $owner -Force
              Remove-Job $installJob -Force
              exit 0
              break
            }
            Start-Sleep -Seconds 1
          }
          $finished = Wait-Job $installJob -Timeout 60
          if (!$finished) {
            Get-Process | Where-Object { $_.MainWindowTitle -or $_.Name -match 'smart|setup|ATE|msedge' } | Select-Object Name,Id,MainWindowTitle | Format-Table -AutoSize
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = New-Object Drawing.Bitmap $bounds.Width,$bounds.Height
            $graphics = [Drawing.Graphics]::FromImage($image)
            $graphics.CopyFromScreen($bounds.Location,[Drawing.Point]::Empty,$bounds.Size)
            $image.Save((Join-Path $env:RUNNER_TEMP 'windows-installer-block.png'))
            $graphics.Dispose(); $image.Dispose()
            throw 'Browser-downloaded installer did not complete within 60 seconds; desktop evidence captured'
          }
          $exitCode = Receive-Job $installJob -ErrorAction Stop
          Remove-Job $installJob
          if ($exitCode -ne 0) { throw "Public installer failed: $exitCode" }
          $exe = Join-Path $destination 'ATE.exe'
          if (!(Test-Path $exe)) { $exe = Join-Path $destination 'ate-desktop.exe' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw 'Public installed application exited unexpectedly' }
          Stop-Process -Id $app.Id
          $result = "PASS: actual public Windows installer downloaded, checksum matched, executable recognized, installed and application launched. Version $($meta.windows.version), SHA256 $hash. Interactive browser/SmartScreen and physical-device acceptance remain unverified."
          $result | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'public-windows-download.txt')
          $result >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-windows-download-evidence
          path: |
            ${{ runner.temp }}/public-windows-download.txt
            ${{ runner.temp }}/browser-download.txt
            ${{ runner.temp }}/windows-installer-block.png
            ${{ runner.temp }}/windows-security-warning.txt
