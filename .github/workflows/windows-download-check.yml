name: ATE public Windows download verification
on:
  workflow_dispatch:
  push:
    branches: [desktop]
    paths: ['.github/workflows/windows-download-check.yml']
permissions:
  contents: read
jobs:
  download-install-launch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Follow the website download button in Microsoft Edge
        shell: pwsh
        run: |
          $task = Join-Path $env:RUNNER_TEMP 'ate-download-browser'
          New-Item -ItemType Directory -Force $task | Out-Null
          npm install --prefix $task --no-save playwright@1.62.1
          $script = @'
          import {chromium} from 'playwright';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          const browser=await chromium.launch({channel:'msedge'});
          try{
            const page=await browser.newPage({acceptDownloads:true});
            await page.goto('https://www.cuberoot-systems.com/ate/');
            const button=page.locator('#windows-download');
            await button.waitFor({state:'visible'});
            const [download]=await Promise.all([page.waitForEvent('download'),button.click()]);
            if(download.suggestedFilename()!=='ate-windows.exe')throw Error('Wrong downloaded filename: '+download.suggestedFilename());
            const destination=join(process.env.RUNNER_TEMP,'ATE-setup.exe');
            await download.saveAs(destination);
            const meta=await (await fetch('https://www.cuberoot-systems.com/downloads/ate-desktop-build.json',{cache:'no-store'})).json();
            const bytes=readFileSync(destination),hash=createHash('sha256').update(bytes).digest('hex');
            if(hash!==meta.windows.sha256||bytes.length!==meta.windows.bytes)throw Error('Browser download checksum mismatch');
            const result='PASS: Microsoft Edge followed the actual website button, saved ate-windows.exe and verified the complete installer checksum. Interactive SmartScreen/device acceptance remains unverified.';
            console.log(result);writeFileSync(join(process.env.RUNNER_TEMP,'browser-download.txt'),result);
          }finally{await browser.close()}
          '@
          $scriptPath = Join-Path $task 'download.mjs'
          [IO.File]::WriteAllText($scriptPath, $script)
          node $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Website browser download failed' }
      - name: Download the public installer, verify it and install on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://www.cuberoot-systems.com/downloads/'
          $meta = Invoke-RestMethod ($base + 'ate-desktop-build.json')
          $installer = Join-Path $env:RUNNER_TEMP 'ATE-setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $meta.windows.sha256) { throw 'Public installer checksum mismatch' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -ne $meta.windows.bytes -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows executable' }
          $destination = Join-Path $env:RUNNER_TEMP 'ATE-public-installed'
          $setup = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Public installer failed: $($setup.ExitCode)" }
          $exe = Join-Path $destination 'ATE.exe'
          if (!(Test-Path $exe)) { $exe = Join-Path $destination 'ate-desktop.exe' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw 'Public installed application exited unexpectedly' }
          Stop-Process -Id $app.Id
          $result = "PASS: actual public Windows installer downloaded, checksum matched, executable recognized, installed and application launched. Version $($meta.windows.version), SHA256 $hash. Interactive browser/SmartScreen and physical-device acceptance remain unverified."
          $result | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'public-windows-download.txt')
          $result >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-windows-download-evidence
          path: |
            ${{ runner.temp }}/public-windows-download.txt
            ${{ runner.temp }}/browser-download.txt
