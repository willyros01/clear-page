name: Clear Page iOS build
on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths: ['src/**', 'index.html', 'package*.json', 'capacitor.config.json', 'build.mjs', 'scripts/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
concurrency:
  group: clear-page-ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate native iOS shell and plugins
        run: node scripts/prepare-ios.mjs
      - name: Build iPhone and iPad simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/simulator-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/simulator-build.log"; exit 1; }
          echo 'PASS: iPhone/iPad simulator compilation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Launch app in simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE" io.github.willyros01.clearpage
          echo 'PASS: app installed and launched in iPad simulator. Physical-device acceptance pending.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Page-iOS-simulator
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - name: Check Apple signing setup
        id: apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ready=true
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name" >> "$GITHUB_STEP_SUMMARY"; ready=false; fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then echo 'TestFlight upload not attempted: Apple setup is incomplete.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Release readiness
        run: echo 'Simulator build only. TestFlight requires app registration, repository Apple credentials, release icon and privacy-manifest validation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-log
          path: ${{ runner.temp }}/simulator-build.log
