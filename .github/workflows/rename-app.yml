name: ATE app name
on:
  push:
    branches: [ios]
    paths: ['build/rename-app.mjs', '.github/workflows/rename-app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update and verify app name
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node build/rename-app.mjs
