[package]
name = "ate-desktop"
version = "0.6.0"
description = "Another Text Editor"
authors = ["Cuberoot Systems Architects Ltd."]
edition = "2021"
rust-version = "1.77.2"

[features]
editor-verification = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
atomicwrites = "0.4"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
