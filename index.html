<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f3"><title>Clear Page — Text editor</title><style>
*{box-sizing:border-box} :root{font-family:Arial,sans-serif;color:#222c29;background:#f8f7f3;font-size:22px;--paper:#fffefa;--line:#cccfc7;--ink:#222c29;--muted:#515d57;--accent:#215c47}body{margin:0;height:100dvh;display:flex;flex-direction:column}body.dark{--paper:#19201e;--line:#4d5c54;--ink:#f5f5ed;--muted:#c0cfc5;--accent:#a5dfbe;background:#111815;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 18px;min-height:54px;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}header{padding:22px 32px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.brand{font-size:30px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--accent)}.actions,.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.settings{padding:16px 32px;border-bottom:1px solid var(--line);justify-content:space-between}.name{min-width:0;width:240px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;color:var(--ink);font-size:24px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#size{min-width:60px;text-align:center;color:var(--muted)}main{flex:1;min-height:120px;display:flex;background:var(--paper)}textarea{resize:none;width:100%;height:100%;border:0;background:transparent;color:var(--ink);padding:32px clamp(24px,5vw,80px);font:36px/1.65 Arial,sans-serif;outline:none!important;tab-size:4}textarea::placeholder{color:#707b73}footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 32px;color:var(--muted);font-size:20px;border-top:1px solid var(--line)}#notice{padding:12px 32px;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}[hidden]{display:none!important}body.focus header,body.focus .settings{display:none}#leaveFocus{display:none}body.focus #leaveFocus{display:block}dialog{max-width:560px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:30px;font-size:26px}dialog::backdrop{background:#0008}dialog p{line-height:1.5}@media(max-width:700px){header{padding:16px;flex-wrap:wrap}.settings{padding:12px 16px}.name{width:100%}.tools{gap:6px}button{padding:10px 13px}footer{padding:12px 16px;font-size:18px}textarea{padding:24px 20px}.brand{font-size:28px}}
#editor{width:100%;min-width:0;height:100%;font-size:36px}main{overflow:hidden;min-height:0}.cm-editor{background:var(--paper);color:var(--ink)}.cm-editor .cm-gutters{background:var(--paper);color:var(--muted);border-color:var(--line)}.cm-editor.cm-focused{outline:2px solid var(--accent);outline-offset:-2px}select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}small{font-size:20px;letter-spacing:normal;color:var(--muted)}button:disabled{opacity:.5}footer{flex-shrink:0}@media(max-width:700px){header,.settings{padding:8px 12px}.tools button,.tools select{font-size:20px;min-height:48px;padding:8px}footer{padding:8px 12px}}
</style></head><body><header><div class="brand"><span>▤</span> Clear Page <small>0.2.0</small></div><div class="actions"><button id="new">New</button><button id="open">Open</button><button id="save" class="primary">Save file</button></div></header><section class="settings" aria-label="Editor settings"><input class="name" id="name" aria-label="File name" value="Untitled.txt"><div class="tools"><select id="language" aria-label="Language"><option value="plain">Plain text</option><option value="javascript">JavaScript</option><option value="html">HTML</option><option value="css">CSS</option><option value="python">Python</option></select><button id="indent">Indent</button><button id="unindent">Unindent</button><button id="smaller" aria-label="Decrease text size">A−</button><output id="size">36px</output><button id="larger" aria-label="Increase text size">A+</button><button id="theme" aria-label="Switch to dark appearance">Dark</button><button id="focus">Full screen</button></div></section><div id="notice" role="status" hidden></div><main><div id="editor"></div></main><footer><span id="keyboard-help" class="sr-only">Tab indents; Shift Tab unindents. Press Escape then Tab to leave the editor.</span><span id="counts">0 words · 0 characters</span><span id="status" role="status">Draft saved on this device</span><button id="leaveFocus">Exit full screen</button></footer><input type="file" id="file" accept="text/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.log" hidden><dialog id="confirm"><h2 id="dialogTitle">Start a new document?</h2><p>Your current draft will be replaced. Save a file first if you want to keep a copy.</p><div class="actions"><button id="cancel">Keep editing</button><button id="proceed" class="primary">Continue</button></div></dialog><script src="./app.js" defer></script></body></html>
