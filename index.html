<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f3"><title>Clear Page — Text editor</title><style>
*{box-sizing:border-box} :root{font-family:Arial,sans-serif;color:#222c29;background:#f8f7f3;font-size:22px;--paper:#fffefa;--line:#cccfc7;--ink:#222c29;--muted:#515d57;--accent:#215c47}body{margin:0;height:100dvh;display:flex;flex-direction:column}body.dark{--paper:#19201e;--line:#4d5c54;--ink:#f5f5ed;--muted:#c0cfc5;--accent:#a5dfbe;background:#111815;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 18px;min-height:54px;font-weight:600}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}header{padding:22px 32px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.brand{font-size:30px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--accent)}.actions,.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.settings{padding:16px 32px;border-bottom:1px solid var(--line);justify-content:space-between}.name{min-width:0;width:240px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;color:var(--ink);font-size:24px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#size{min-width:60px;text-align:center;color:var(--muted)}main{flex:1;min-height:120px;display:flex;background:var(--paper)}textarea{resize:none;width:100%;height:100%;border:0;background:transparent;color:var(--ink);padding:32px clamp(24px,5vw,80px);font:36px/1.65 Arial,sans-serif;outline:none!important;tab-size:4}textarea::placeholder{color:#707b73}footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 32px;color:var(--muted);font-size:20px;border-top:1px solid var(--line)}#notice{padding:12px 32px;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}[hidden]{display:none!important}body.focus header,body.focus .settings{display:none}#leaveFocus{display:none}body.focus #leaveFocus{display:block}dialog{max-width:560px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:30px;font-size:26px}dialog::backdrop{background:#0008}dialog p{line-height:1.5}@media(max-width:700px){header{padding:16px;flex-wrap:wrap}.settings{padding:12px 16px}.name{width:100%}.tools{gap:6px}button{padding:10px 13px}footer{padding:12px 16px;font-size:18px}textarea{padding:24px 20px}.brand{font-size:28px}}
</style></head><body><header><div class="brand"><span>▤</span> Clear Page</div><div class="actions"><button id="new">New</button><button id="open">Open</button><button id="save" class="primary">Save file</button></div></header><section class="settings" aria-label="Editor settings"><input class="name" id="name" aria-label="File name" value="Untitled.txt"><div class="tools"><button id="smaller" aria-label="Decrease text size">A−</button><output id="size">36px</output><button id="larger" aria-label="Increase text size">A+</button><button id="theme" aria-label="Switch to dark appearance">Dark</button><button id="focus">Full screen</button></div></section><div id="notice" role="status" hidden></div><main><textarea id="editor" aria-label="Text editor" placeholder="Start writing here…" spellcheck="true"></textarea></main><footer><span id="counts">0 words · 0 characters</span><span id="status" role="status">Draft saved on this device</span><button id="leaveFocus">Exit full screen</button></footer><input type="file" id="file" accept="text/*,.txt,.md,.csv,.json,.js,.html,.css,.log" hidden><dialog id="confirm"><h2 id="dialogTitle">Start a new document?</h2><p>Your current draft will be replaced. Save a file first if you want to keep a copy.</p><div class="actions"><button id="cancel">Keep editing</button><button id="proceed" class="primary">Continue</button></div></dialog><script>
const $=id=>document.getElementById(id), editor=$('editor');let font=36,dirty=false,pending=null;const key='clear-page-draft-v1';
function notice(msg){$('notice').textContent=msg;$('notice').hidden=!msg}
function counts(){const t=editor.value;const words=t.trim()?t.trim().split(/\s+/u).length:0;$('counts').textContent=`${words.toLocaleString()} ${words===1?'word':'words'} · ${Array.from(t).length.toLocaleString()} characters`}
function persist(){try{localStorage.setItem(key,JSON.stringify({text:editor.value,name:$('name').value,font,dark:document.body.classList.contains('dark')}));$('status').textContent='Draft saved on this device'}catch(e){$('status').textContent='Draft not saved — use Save file'}}
function updateSize(){editor.style.fontSize=font+'px';$('size').textContent=font+'px';$('smaller').disabled=font<=24;$('larger').disabled=font>=72}
function themeLabel(){$('theme').textContent=document.body.classList.contains('dark')?'Light':'Dark';$('theme').setAttribute('aria-label','Switch to '+$('theme').textContent.toLowerCase()+' appearance')}
try{let d=JSON.parse(localStorage.getItem(key));if(d){editor.value=d.text||'';$('name').value=d.name||'Untitled.txt';font=Math.min(72,Math.max(24,Number(d.font)||36));document.body.classList.toggle('dark',!!d.dark)}}catch(e){$('status').textContent='Use Save file to keep your work'}counts();updateSize();themeLabel();
editor.addEventListener('input',()=>{dirty=true;counts();persist()});$('name').oninput=persist;
$('smaller').onclick=()=>{font=Math.max(24,font-4);updateSize();persist()};$('larger').onclick=()=>{font=Math.min(72,font+4);updateSize();persist()};$('theme').onclick=()=>{document.body.classList.toggle('dark');themeLabel();persist()};
function save(){let name=$('name').value.trim()||'Untitled.txt';if(!/\.[a-z0-9]+$/i.test(name))name+='.txt';const blob=new Blob([editor.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);dirty=false;notice('File download started. Your draft is also kept in this browser.');persist()}
$('save').onclick=save;
function guard(action,title){if(editor.value){pending=action;$('dialogTitle').textContent=title;$('confirm').showModal()}else action()}
$('cancel').onclick=()=>{$('confirm').close();pending=null};$('proceed').onclick=()=>{const fn=pending;pending=null;$('confirm').close();if(fn)fn()};
$('new').onclick=()=>guard(()=>{editor.value='';$('name').value='Untitled.txt';dirty=false;counts();persist();notice('');editor.focus()},'Start a new document?');
$('open').onclick=()=>guard(()=>$('file').click(),'Open another document?');$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw new Error('Please choose a text file smaller than 10 MB.');const text=await f.text();if(text.includes('\u0000'))throw new Error('This does not look like a plain-text file.');editor.value=text;$('name').value=f.name;dirty=false;counts();persist();notice('Opened '+f.name);editor.focus()}catch(err){notice(err.message||'Could not open this file.')}finally{e.target.value=''}};
$('focus').onclick=async()=>{document.body.classList.add('focus');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}editor.focus()};
async function leave(){document.body.classList.remove('focus');if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}}
$('leaveFocus').onclick=leave;document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('focus')});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.key==='Escape')leave()});window.addEventListener('beforeunload',e=>{if(dirty&&$('status').textContent.startsWith('Draft not')){e.preventDefault();e.returnValue=''}});
</script></body></html>
